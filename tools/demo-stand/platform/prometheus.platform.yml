# Prometheus configuration of the demo stand WITH the platform compatibility layer (plan P0e).
# A complete file (promtool check config needs one): it replaces ../prometheus/prometheus.yml when a cAdvisor
# service is added to the stand. Demo infrastructure only, not a product dependency.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/platform-compat.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    # cAdvisor must expose compose labels as container_label_* (its default). Target: the cAdvisor service of the stand.
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Keep only containers of a compose project (name, project and service are all non-empty); drops root cgroups and
      # foreign containers. Replace the middle ".+" with the project name to cover just the application under test.
      - action: keep
        source_labels:
          - name
          - container_label_com_docker_compose_project
          - container_label_com_docker_compose_service
        separator: ";"
        regex: ".+;.+;.+"
      # label contract: namespace shop, pod = container name, container app, workload = compose service
      - action: replace
        target_label: namespace
        replacement: shop
      - action: replace
        source_labels: [name]
        target_label: pod
      - action: replace
        target_label: container
        replacement: app
      - action: replace
        source_labels: [container_label_com_docker_compose_service]
        target_label: workload
