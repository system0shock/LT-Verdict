# Release: push of a tag vX.Y.Z[-suffix] builds ltv-<version>.zip, smoke-tests the unpacked archive
# and attaches the zip and its SHA256 to a DRAFT GitHub Release. A manual run (workflow_dispatch)
# builds and tests only; it never publishes. Owner steps: docs/development-process.md, "Выпуск версии".
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a trial build, no publishing (for example 0.0.0-dryrun)"
        required: false
        default: "0.0.0-dryrun"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history and origin/main are needed for the ancestry check below.
          fetch-depth: 0
      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            raw="$REF_NAME"
            pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
            hint="tag must look like v0.1.0 or v0.1.0-rc.1"
            [[ "$raw" =~ $pattern ]] || { echo "::error::Unsupported tag '$raw': $hint"; exit 1; }
            version="${raw#v}"
          else
            version="$INPUT_VERSION"
            pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
            [[ "$version" =~ $pattern ]] || { echo "::error::Unsupported version '$version': must look like 0.1.0 or 0.1.0-rc.1"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require tagged commit to be on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tagged commit is not in origin/main history; tag a verified main commit"; exit 1; }
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js 24.14.0
        # Node is needed only to build the UI that ends up inside the archive.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24.14.0
      - name: Build distribution
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon "-PltvVersion=$VERSION" distZip
      - name: Smoke-test the unpacked archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          zip="build/distributions/ltv-${VERSION}.zip"
          test -f "$zip"
          work="$(mktemp -d)"
          unzip -q "$zip" -d "$work"
          home="$work/ltv-${VERSION}"
          unzip -l "$home/lib/lt-verdict-${VERSION}.jar" | grep -q ' web/index.html$'
          # Empty environment: only Java is reachable, no Gradle, Node or npm on PATH.
          run() { env -i HOME="$work" PATH=/usr/bin:/bin JAVA_HOME="$JAVA_HOME" "$@"; }
          [[ "$(run "$home/bin/ltv" --version)" == "ltv ${VERSION}" ]]
          run "$home/bin/ltv" analyze fixtures/slice1/jmeter/csv-5.6.3/input.jtl \
            --data-dir "$work/data" --out-dir "$work/out" > /dev/null
          for f in result.json report.html chart.svg summary.txt junit.xml; do
            test -s "$work/out/$f"
          done
      - name: Write SHA256
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd build/distributions
          sha256sum "ltv-${VERSION}.zip" > "ltv-${VERSION}.zip.sha256"
          sha256sum -c "ltv-${VERSION}.zip.sha256"
      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ltv-dist
          path: |
            build/distributions/ltv-${{ steps.version.outputs.version }}.zip
            build/distributions/ltv-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft GitHub Release
    # Tags only. This job has write access, so it checks out nothing and runs no project code.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ltv-dist
          path: dist
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          [[ "$(ls | sort | tr '\n' ' ')" == "ltv-${VERSION}.zip ltv-${VERSION}.zip.sha256 " ]]
          sha256sum -c "ltv-${VERSION}.zip.sha256"
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "ltv-${VERSION}.zip" "ltv-${VERSION}.zip.sha256" \
            --draft --verify-tag --generate-notes --title "LT Verdict ${VERSION}" "${flags[@]}"
