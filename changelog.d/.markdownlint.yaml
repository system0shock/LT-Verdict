# Фрагменты журнала изменений короткие, без заголовка первого уровня: раздел
# задаёт тип в имени файла, а текст целиком вставляется в CHANGELOG.md.
# Конфиг каталога заменяет корневой, поэтому правила корня повторены; от них
# отличается только MD041 (первая строка не обязана быть заголовком).
default: true
MD013: false
MD024:
  siblings_only: true
MD033: false
MD041: false
