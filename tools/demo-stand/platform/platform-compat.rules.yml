# Compatibility layer of the local demo stand (platform plan P0e): recording rules that turn cAdvisor series
# (already relabelled by prometheus.platform.yml) into the label contract of docs/user/platform-metric-packs.md.
# Demo infrastructure only: not a product dependency. Checked by tools/test_platform_stand.py (promtool).
#
# Deliberately NOT recorded: kube_pod_info. It is the liveness source of the "restarts" signal; deriving it from
# cAdvisor would turn restarts into a fabricated zero. Without it restarts stays a gap on this stand.
groups:
  - name: ltv-platform-compat
    interval: 5s
    rules:
      # pod -> service mapping (value 1); one record per live container of the compose service
      - record: namespace_workload_pod:kube_pod_owner:relabel
        expr: group by (namespace, pod, workload) (container_last_seen{job="cadvisor"})

      # irate window of 1m covers at least two samples at the 5-10 s scrape interval of the stand
      - record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate
        expr: sum by (namespace, pod, container) (irate(container_cpu_usage_seconds_total{job="cadvisor"}[1m]))

      # expected containers of the service; taken from another cAdvisor family than the usage series
      - record: kube_pod_container_info
        expr: group by (namespace, pod, container) (container_start_time_seconds{job="cadvisor"})

      # limits only where one is declared: cAdvisor reports 0 (or a non-positive quota) for "no limit"
      - record: kube_pod_container_resource_limits
        expr: max by (namespace, pod, container) (container_spec_memory_limit_bytes{job="cadvisor"} > 0)
        labels:
          resource: memory
      - record: kube_pod_container_resource_limits
        expr: >-
          max by (namespace, pod, container) (container_spec_cpu_quota{job="cadvisor"} > 0)
          / on (namespace, pod, container)
          max by (namespace, pod, container) (container_spec_cpu_period{job="cadvisor"} > 0)
        labels:
          resource: cpu
