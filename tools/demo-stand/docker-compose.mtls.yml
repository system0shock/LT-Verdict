# Optional mTLS stand; requires the base demo stand running first
# (docker compose up -d --wait in tools/demo-stand).
name: ltv-mtls-stand

services:
  certs:
    image: alpine/openssl:3.3.2
    entrypoint: ["/bin/sh", "/generate-certs.sh"]
    volumes:
      - ./mtls/generate-certs.sh:/generate-certs.sh:ro
      - ./out/mtls:/out
    restart: "no"

  proxy:
    image: nginx:1.27.5-alpine
    depends_on:
      certs:
        condition: service_completed_successfully
    volumes:
      - ./mtls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./out/mtls:/certs:ro
    ports:
      - "127.0.0.1:13443:8443"
    networks:
      - default
      - demo
    restart: "no"

networks:
  demo:
    external: true
    name: ltv-demo-stand_default
