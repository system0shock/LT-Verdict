# Runtime checks run in parallel; browser tests use online and offline shards.
# Runtime and Performance remain stable required-check names.
name: Runtime quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: runtime-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: "Runtime: static checks and Python"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Node.js 24.14.0
        # No npm cache here: this job never runs npm ci, so it must not seed the shared npm cache key.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24.14.0
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install Python test dependencies
        # numpy is needed only by the correlation validation tests.
        run: python -m pip install numpy==2.4.2
      - name: Verify Slice 0 contracts
        run: python tools/verify_slice0.py
      - name: Run Python tests
        # Discovers every tools/test_*.py. Python 3.14 and numpy are installed above,
        # so the correlation and process-pool tests run here instead of skipping.
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Verify isolated AI relay contract without provider calls
        run: node --test tools/test_advisory_ai_runtime_relay.mjs
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md"
      - name: Check committed whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}"...HEAD
      - name: Scan tracked files for private keys and AWS access keys
        shell: bash
        run: |
          set +e
          matches="$(git grep -n -I -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})' -- .)"
          status=$?
          set -e
          if (( status > 1 )); then exit "$status"; fi
          if [[ -n "$matches" ]]; then echo "$matches"; exit 1; fi

  ui:
    name: "Runtime: UI static checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix ui ci
      - name: Type-check frontend
        run: npm --prefix ui run typecheck
      - name: Lint frontend
        run: npm --prefix ui run lint
      - name: Verify frontend contracts
        run: npm --prefix ui run test:contracts
      - name: Build frontend
        run: npm --prefix ui run build

  e2e-online:
    name: "Runtime: browser tests ${{ matrix.shard }}/2"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          # Only the full-check shards seed the Gradle cache; this job restores it without saving a partial one.
          cache-read-only: true
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix ui ci
      - name: Install Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Compile e2e server classes
        run: ./gradlew --no-daemon testClasses processResources
      - name: Run browser tests
        run: npm --prefix ui run e2e -- --shard=${{ matrix.shard }}/2

  build-offline:
    name: "Runtime: Kotlin check and offline build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix ui ci
      # The online build populates local caches needed by the offline rebuild.
      - name: Check and package runtime
        run: ./gradlew --no-daemon clean check installDist
      - name: Reinstall frontend dependencies offline
        run: npm --prefix ui ci --offline
      - name: Rebuild runtime offline
        run: ./gradlew -PnpmOffline=true --offline --no-daemon clean check installDist
      - name: Upload offline E2E runtime artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-offline-runtime
          path: |
            build/install/ltv/lib
            build/classes/kotlin/test
          if-no-files-found: error
          retention-days: 1

  e2e-offline:
    name: "Runtime: offline browser tests ${{ matrix.shard }}/4"
    needs: build-offline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Download offline E2E runtime artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-offline-runtime
          path: build
      - name: Reinstall frontend dependencies offline
        run: npm --prefix ui ci --offline
      - name: Install Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Run browser tests after offline rebuild
        env:
          LTV_E2E_PREBUILT: "1"
        run: npm --prefix ui run e2e -- --shard=${{ matrix.shard }}/4

  postgres:
    name: "Runtime: PostgreSQL integration"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ltv_admin
          POSTGRES_PASSWORD: ltv_admin_password
          POSTGRES_DB: lt_verdict_it
        command: postgres -c shared_preload_libraries=pg_stat_statements
        options: --health-cmd "pg_isready -U ltv_admin -d lt_verdict_it" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - "5432:5432"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-read-only: true
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix ui ci
      - name: Initialize PostgreSQL extension and capture role
        env:
          PGPASSWORD: ltv_admin_password
        run: |
          psql -h 127.0.0.1 -p 5432 -U ltv_admin -d lt_verdict_it -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
          CREATE ROLE ltv_capture WITH LOGIN PASSWORD 'ltv_capture_password' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT;
          GRANT pg_read_all_stats TO ltv_capture;
          SQL
      - name: Run PostgreSQL integration test (strict gate)
        env:
          LTV_REQUIRE_POSTGRES: "1"
          LT_VERDICT_PG_IT_DEDICATED: "true"
          LT_VERDICT_PG_IT_HOST: "127.0.0.1"
          LT_VERDICT_PG_IT_PORT: "5432"
          LT_VERDICT_PG_IT_DATABASE: "lt_verdict_it"
          LT_VERDICT_PG_IT_ADMIN_USER: "ltv_admin"
          LT_VERDICT_PG_IT_ADMIN_PASSWORD: "ltv_admin_password"
          LT_VERDICT_PG_IT_CAPTURE_USER: "ltv_capture"
          LT_VERDICT_PG_IT_CAPTURE_PASSWORD: "ltv_capture_password"
          LT_VERDICT_PG_IT_ALLOW_INSECURE: "true"
        run: ./gradlew --no-daemon --no-build-cache cleanTest test --tests "io.ltverdict.sources.PostgresSourceTest" -x npmCi

  performance:
    name: Performance
    # Builds its own distribution independently of the runtime jobs.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          # Only the full-check shards seed the Gradle cache; this job restores it without saving a partial one.
          cache-read-only: true
      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.3.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix ui ci
      - name: Build distribution
        run: ./gradlew --no-daemon installDist
      - name: Run bounded JTL probe
        run: bash tools/perf/jtl_probe.sh

  runtime:
    # This job is the single required status check named Runtime.
    name: Runtime
    needs: [checks, ui, e2e-online, build-offline, e2e-offline, postgres]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every runtime job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          echo "Runtime job results: $RESULTS"
          if [[ -z "$RESULTS" ]]; then
            echo "Runtime has no job results" >&2
            exit 1
          fi
          for result in $RESULTS; do
            if [[ "$result" != success ]]; then
              echo "Runtime requires every job to succeed; got: $RESULTS" >&2
              exit 1
            fi
          done
