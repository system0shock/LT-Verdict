<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LT Verdict — интерактивный макет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: постоянная шапка с вердиктом + левая навигация из пяти разделов; обзор ведёт в глубокий анализ по клику на карточку. */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#13202B; --muted:#56667A; --line:#DCE2E8; --soft:#F5F7F9;
  --accent:#1D5FA8; --accent-bg:#E4EEF9;
  --crit:#B3261E; --crit-bg:#FBE9E7; --crit-solid:#B3261E; --good-solid:#256F4F; --warn-solid:#8A5A00; --on-accent:#FFFFFF;
  --warn:#8A5A00; --warn-bg:#FCEFD0; --good:#256F4F; --good-bg:#E2F2EA;
  --s-p95:#1D5FA8; --s-rps:#64748B; --s-cpu:#0E8F86; --s-heap:#7B4FB3; --s-err:#B3261E; --s-base:#8A97A6;
  --sans:'Onest','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono',Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171F; --panel:#17222D; --ink:#E6ECF2; --muted:#93A3B5; --line:#2A3846; --soft:#1C2935;
  --accent:#6FA8F0; --accent-bg:#1B2C42;
  --crit:#FF8F86; --crit-bg:#3A1D1B; --crit-solid:#D9453B; --good-solid:#2E8B62; --warn-solid:#9A6A00; --on-accent:#0F171F;
  --warn:#F2C265; --warn-bg:#33290F; --good:#6FCB9F; --good-bg:#12301F;
  --s-p95:#6FA8F0; --s-rps:#9AA8B8; --s-cpu:#4FD1C5; --s-heap:#B794F4; --s-err:#FF8F86; --s-base:#7D8C9C;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F171F; --panel:#17222D; --ink:#E6ECF2; --muted:#93A3B5; --line:#2A3846; --soft:#1C2935;
  --accent:#6FA8F0; --accent-bg:#1B2C42;
  --crit:#FF8F86; --crit-bg:#3A1D1B; --crit-solid:#D9453B; --good-solid:#2E8B62; --warn-solid:#9A6A00; --on-accent:#0F171F;
  --warn:#F2C265; --warn-bg:#33290F; --good:#6FCB9F; --good-bg:#12301F;
  --s-p95:#6FA8F0; --s-rps:#9AA8B8; --s-cpu:#4FD1C5; --s-heap:#B794F4; --s-err:#FF8F86; --s-base:#7D8C9C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* sidebar */
aside.rail{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:24px}
.brand{font:600 19px/1 var(--sans);letter-spacing:-.01em;padding:4px 10px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-bg);color:var(--accent)}
.nav a .cnt{margin-left:auto;font:500 12px/1 var(--mono)}
.srcs{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:8px}
.srcs li{list-style:none;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.srcs ul{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.kicker{font:600 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* topbar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.runmeta{display:flex;flex-direction:column;gap:4px}
.runmeta b{font-weight:600;font-size:16px}
.runmeta span{font:400 12px/1 var(--mono);color:var(--muted)}
.topright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verdict{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 14px 0 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);text-decoration:none;color:var(--ink)}
.verdict .v.PASS,.vbadge.PASS{background:var(--good-solid)} .verdict .v.NO_VERDICT,.vbadge.NO_VERDICT,.verdict .v.NO_POLICY,.vbadge.NO_POLICY{background:var(--warn-solid)}
.verdict .v{font:600 15px/1 var(--mono);color:#fff;background:var(--crit-solid);height:28px;padding:0 10px;border-radius:5px;display:inline-flex;align-items:center}
.wrap{padding:28px 32px 56px;display:flex;flex-direction:column;gap:32px;max-width:1360px;width:100%}
.view[hidden]{display:none}
.view{display:flex;flex-direction:column;gap:32px}
/* controls */
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{height:34px;padding:0 14px;border:0;background:transparent;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
input[type=text],input[type=number],input[type=datetime-local],select,input[type=search]{height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font:600 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.good{background:var(--good-bg);color:var(--good)} .pill.info{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.pill.s{height:20px;font-size:11px;padding:0 8px}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sec-h h2{font:600 22px/1.2 var(--sans)} .sec-h p{color:var(--muted);max-width:720px;margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:stretch}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.acard{display:flex;flex-direction:column;gap:14px}
.acard header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.acard h3{font:600 17px/1.25 var(--sans)} .sub{font-size:13px;color:var(--muted)}
.why{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.why p{line-height:1.5} .src{font:400 12px/1.4 var(--mono);color:var(--muted)}
.vcard{display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap;padding:24px 28px}
.vbadge{width:124px;height:88px;border-radius:10px;background:var(--crit-solid);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex:none}
.vbadge b{font:600 32px/1 var(--mono)} .vbadge span{font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:0}
.stat{padding:0 24px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.stat b{font:600 24px/1 var(--mono)} .stat span{font-size:13px;color:var(--muted)}
.tile{display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .top2{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-weight:500;font-size:13px}
.tile .val{display:flex;align-items:baseline;gap:6px} .tile .val b{font:600 26px/1 var(--mono)} .tile .val span{color:var(--muted);font-size:13px}
.note{background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:14px 16px;font-size:13px;display:flex;gap:10px}
.note b{color:var(--warn);font-weight:600}
/* charts */
.chart{position:relative} .chart svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--line);stroke-width:1} .tx{fill:var(--muted);font:11px var(--mono)} .frame{fill:none;stroke:var(--line)}
.guide line{stroke:var(--ink);stroke-width:1.5} .guide rect{fill:var(--ink)} .guide text{fill:var(--panel);font:11px var(--mono)}
.chip{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.chip[aria-pressed="false"]{opacity:.55}
.chip i{width:14px;height:14px;border-radius:3px;display:block}
.chip .num{font-size:13px}
.ovl{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-height:520px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--soft);font:600 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);z-index:1}
th button{background:none;border:0;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:inline-flex;gap:4px;align-items:center}
td.r,th.r{text-align:right} tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
a.lnk{color:var(--accent);text-decoration:none;font-weight:500} a.lnk:hover{text-decoration:underline}
/* deep */
.deep{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.mlist{display:flex;flex-direction:column;gap:14px;position:sticky;top:96px;max-height:calc(100vh - 120px);overflow:auto}
.mgroup{display:flex;flex-direction:column;gap:4px}
.mrow{display:flex;align-items:center;gap:4px}
.mrow .pick{flex:1;text-align:left;padding:8px 10px;border-radius:6px;border:1px solid transparent;background:transparent;display:flex;justify-content:space-between;gap:8px}
.mrow .pick:hover{background:var(--soft)}
.mrow .pick[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);font-weight:500}
.mrow .pin{width:30px;height:30px;border-radius:6px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.mrow .pin[aria-pressed="true"]{color:var(--accent)}
.ctl{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ctl label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sstrip div{background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.sstrip b{font:600 16px/1 var(--mono)} .sstrip span{font-size:12px;color:var(--muted)}
.ro{font:500 13px/1 var(--mono);color:var(--muted);min-height:13px}
/* ai */
.aigrid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-of-type{border-bottom:0}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.hyp{display:flex;flex-direction:column;gap:12px}
.hyp h3{font:600 17px/1.3 var(--sans)}
.evl{display:flex;gap:8px;flex-wrap:wrap}
.todo{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20}
.toast[hidden]{display:none}

.grp{padding:14px 12px 4px;font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:42px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none}
.nav a.newbtn,.nav a.newbtn[aria-current="page"]{background:var(--accent);color:var(--on-accent)} .nav a.newbtn:hover{filter:brightness(1.08);background:var(--accent);color:var(--on-accent)} .nav a.newbtn[aria-current="page"]{box-shadow:0 0 0 3px var(--accent-bg)}
.sstrip{display:flex;flex-wrap:wrap;gap:8px;background:none;border:0;border-radius:0;overflow:visible} .sstrip div{flex:1 1 110px;border:1px solid var(--line);border-radius:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0} .field>label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{width:100%}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.setup{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.polgrid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 16px;border:2px dashed var(--line);border-radius:10px;text-align:center;cursor:pointer;background:var(--soft)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-bg)}
.drop input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,240px);gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.step{display:flex;gap:12px;align-items:center;padding:9px 0;color:var(--muted)} .step.done{color:var(--ink)} .step.now{color:var(--accent);font-weight:500}
.step i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-style:normal;font-size:11px}
.step.done i{background:var(--good-solid);border-color:var(--good-solid);color:#fff}
.step.now i{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rrow{display:grid;grid-template-columns:minmax(130px,1.1fr) minmax(190px,1.4fr) 66px 96px minmax(170px,1.3fr) minmax(160px,1fr) 36px;gap:10px;align-items:end;padding:14px 0;border-bottom:1px solid var(--line)}
.pol{width:100%;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pol[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-bg)}
.rchart svg{display:block;width:100%;height:auto;overflow:visible}
.mx{display:grid;grid-template-columns:minmax(140px,.6fr) minmax(0,1fr) minmax(0,1fr);gap:8px 10px;align-items:stretch}
.ctl label{min-width:0;max-width:100%} .ctl select{max-width:100%;min-width:0;text-overflow:ellipsis}
.stages{display:flex;gap:4px;align-items:stretch}
.stg{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;text-align:left;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink)}
.stg.fixed{flex:none}
.stg b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stg span{font:11px var(--mono);color:var(--muted)}
.stg:hover{border-color:var(--accent)}
.stg[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)} .stg[aria-pressed="true"] span{color:var(--panel);opacity:.8}
.trow{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(130px,1fr) 64px minmax(120px,1fr) minmax(110px,.8fr) minmax(90px,.7fr) 96px 88px 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.trow.head{font:600 11px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.chk-ok{color:var(--good);font-weight:600} .chk-no{color:var(--muted)}
.req{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.req .d{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;color:#fff;margin-top:2px}
@media (max-width:1100px){.setup,.polgrid{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.ovl,.deep,.aigrid{grid-template-columns:1fr}.mlist{position:static;max-height:none}}
@media (max-width:820px){.stages{flex-wrap:wrap}.stg{flex:1 1 30% !important}.brand{flex:none}.nav{flex:none}.nav .grp{display:none}.nav a{flex:none}.mx{grid-template-columns:1fr 1fr}.mx .hd{display:none}.mx .nm{grid-column:1/-1;padding-top:8px}.rrow{grid-template-columns:1fr 1fr}.srow{grid-template-columns:1fr}
  body{grid-template-columns:1fr}
  aside.rail{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 16px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);gap:12px}
  .nav{flex-direction:row} .nav a{white-space:nowrap} .srcs{display:none}
  .top{padding:12px 16px;position:static}.wrap{padding:20px 16px 48px}.grid4,.grid2{grid-template-columns:1fr}
  .stat{border-left:0;padding:8px 24px 8px 0}
}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>

</head>
<body>
<aside class="rail" aria-label="Разделы">
  <div class="brand">LT Verdict</div>
  <nav class="nav" id="nav" aria-label="Разделы"></nav>
  <div class="srcs"><span class="kicker">Источники</span><ul>
    <li><span>JMeter JTL</span><span style="color:var(--good)">полный</span></li>
    <li><span>Prometheus</span><span style="color:var(--good)">полный</span></li>
    <li><span>OpenSearch</span><span style="color:var(--good)">полный</span></li></ul></div>
</aside>

<div class="main">
  <header class="top">
    <div class="runmeta"><b>Checkout, релиз 2026.09.3</b><span>29.09.2026 · 10:00–18:00 · 8 ч · окно задано политикой</span></div>
    <div class="topright">
      <span class="pill info" id="scopepill"></span>
      <span class="pill info">Макет · условные данные</span>
      <a class="pill info" id="bpill" href="#history" style="text-decoration:none"></a>
      <a class="verdict" id="vchip" href="#tables" data-tab="rules"></a>
      <button class="btn" type="button" data-act="toast" data-msg="В макете скачивание не работает. В продукте: JSON, HTML и AsciiDoc для Confluence.">Экспорт</button>
    </div>
  </header>
  <main class="wrap">
    <section class="view" id="v-new" hidden></section>
    <section class="view" id="v-overview" hidden></section>
    <section class="view" id="v-deep" hidden></section>
    <section class="view" id="v-tables" hidden></section>
    <section class="view" id="v-ai" hidden></section>
    <section class="view" id="v-compare" hidden></section>
    <section class="view" id="v-rules" hidden></section>
    <section class="view" id="v-history" hidden></section>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>

function txRows() {

}

аки: среднее и худший под. Нажмите на сервис, чтобы увидеть каждый под тепловой картой. Ряды платформы участвуют в вердикте только через правила.</p>`;
